ServiceMaps:
  serviceName: project
  version: 1.0.0
  mappings:
    - topic: transformer-producer-user-action-index-v1-topic
      configKey: INDEX
      indexes:
        - name: user-action-index-v1
          type: UserAction
          id: $.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping: { "Data": {} }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.userAction.clientAuditDetails.lastModifiedTime
    - topic: transformer-producer-user-action-index-v1-topic-stock-balance
      configKey: INDEX
      indexes:
        - name: user-action-stock-balance-index-v1
          type: UserAction
          id: $.userAction.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping: { "Data": {} }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.userAction.clientAuditDetails.lastModifiedTime
    - topic: transformer-producer-user-action-index-v1-topic-other
      configKey: INDEX
      indexes:
        - name: user-action-other-index-v1
          type: UserAction
          id: $.userAction.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping: { "Data": {} }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.userAction.clientAuditDetails.lastModifiedTime
