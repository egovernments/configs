ServiceMaps:
  serviceName: Project Service
  version: 1.0.0
  mappings:
    - topic: transformer-producer-bulk-project-index-v1-health-topic
      configKey: INDEX
      indexes:
        - name: project-index-v1
          type: projects
          id: $.id
          isBulk: true
          jsonPath: $
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $
                outJsonPath: $.Data
          timeStampField: $.createdTime

    - topic: save-project-beneficiary-health-topic
      configKey: INDEX
      indexes:
        - name: project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime

    - topic: update-project-beneficiary-health-topic
      configKey: INDEX
      indexes:
        - name: project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime

    - topic: delete-project-beneficiary-health-topic
      configKey: INDEX
      indexes:
        - name: project-beneficiary-index-v1
          type: project-beneficiary
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime


    - topic: save-project-resource-health-topic
      configKey: INDEX
      indexes:
        - name: project-resource-index-v1
          type: project-resource
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.createdTime

    - topic: update-project-resource-health-topic
      configKey: INDEX
      indexes:
        - name: project-resource-index-v1
          type: project-resource
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime

    - topic: delete-project-resource-health-topic
      configKey: INDEX
      indexes:
        - name: project-resource-index-v1
          type: project-resource
          id: $.id
          isBulk: true
          jsonPath: $.*
          timeStampField: $.auditDetails.lastModifiedTime

    - topic: save-project-facility-health-topic
      configKey: INDEX
      indexes:
        - name: project-facility-index-v1
          type: project-facility
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema != 'PostAssignment')]"
          timeStampField: $.auditDetails.createdTime
        - name: outside-household-campaign-index-v1
          type: outside-household-campaign
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema == 'PostAssignment')]"
          timeStampField: $.auditDetails.createdTime
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.projectId
                outJsonPath: $.Data.projectId
              - inJsonPath: $.facilityId
                outJsonPath: $.Data.facilityId
              - inJsonPath: $.isDeleted
                outJsonPath: $.Data.isDeleted
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails

    - topic: update-project-facility-health-topic
      configKey: INDEX
      indexes:
        - name: project-facility-index-v1
          type: project-facility
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema != 'PostAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
        - name: outside-household-campaign-index-v1
          type: outside-household-campaign
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema == 'PostAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.projectId
                outJsonPath: $.Data.projectId
              - inJsonPath: $.facilityId
                outJsonPath: $.Data.facilityId
              - inJsonPath: $.isDeleted
                outJsonPath: $.Data.isDeleted
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails

    - topic: delete-project-facility-health-topic
      configKey: INDEX
      indexes:
        - name: project-facility-index-v1
          type: project-facility
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema != 'PostAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
        - name: outside-household-campaign-index-v1
          type: outside-household-campaign
          id: $.id
          isBulk: true
          jsonPath: "$[?(@.additionalFields.schema == 'PostAssignment')]"
          timeStampField: $.auditDetails.lastModifiedTime
          customJsonMapping:
            indexMapping: { "Data": { } }
            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id
              - inJsonPath: $.tenantId
                outJsonPath: $.Data.tenantId
              - inJsonPath: $.projectId
                outJsonPath: $.Data.projectId
              - inJsonPath: $.facilityId
                outJsonPath: $.Data.facilityId
              - inJsonPath: $.isDeleted
                outJsonPath: $.Data.isDeleted
              - inJsonPath: $.auditDetails
                outJsonPath: $.Data.auditDetails
