      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO health.REFERRAL(id, clientReferenceId, tenantId, projectBeneficiaryId, projectBeneficiaryClientReferenceId, projectId, referrerId, recipientId, recipientType, reasons, additionalDetails, sideEffectId, sideEffectClientReferenceId, createdBy, createdTime, lastModifiedBy, lastModifiedTime, clientCreatedBy, clientCreatedTime, clientLastModifiedBy, clientLastModifiedTime, rowVersion, isDeleted) VALUES(?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?);
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.id
            - jsonPath: $.*.clientReferenceId
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.projectBeneficiaryId
            - jsonPath: $.*.projectBeneficiaryClientReferenceId
            - jsonPath: $.*.projectId
            - jsonPath: $.*.referrerId
            - jsonPath: $.*.recipientId
            - jsonPath: $.*.recipientType
            - jsonPath: $.*.reasons
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.sideEffect.id
            - jsonPath: $.*.sideEffect.clientReferenceId
            - jsonPath: $.*.auditDetails.createdBy
            - jsonPath: $.*.auditDetails.createdTime
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.clientAuditDetails.createdBy
            - jsonPath: $.*.clientAuditDetails.createdTime
            - jsonPath: $.*.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted

    - version: 1.0
      description: Updates a referral
      fromTopic: update-referral-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: REFERRALMANAGEMENT
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      userUuidJsonPath: $.[0].auditDetails.createdBy
      transactionCodeJsonPath: $.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        # Same unconditional-overwrite defect as SIDE_EFFECT above: an update that omits
        # projectBeneficiaryId / projectBeneficiaryClientReferenceId (legitimate post-unbundle, where
        # only one of the pair is resolvable) NULLed both on an already-persisted row and orphaned the
        # referral. COALESCE every link column so an omitted link preserves the stored value.
        # recipientType, reasons and additionalDetails are payload, not links, and stay unconditional.
        # Optimistic-lock guard (proven live in DI-L06): without a version predicate a stale or
        # out-of-order replay silently overwrote a newer row. rowVersion <= ? applies the write only
        # if the stored version is not ahead of the incoming one; a stale message now affects 0 rows,
        # which the affected-rows classifier surfaces instead of losing the write.
        - query: UPDATE health.REFERRAL SET tenantId = ?, projectBeneficiaryId = COALESCE(CAST(? AS varchar), projectBeneficiaryId), projectBeneficiaryClientReferenceId = COALESCE(CAST(? AS varchar), projectBeneficiaryClientReferenceId), projectId = COALESCE(CAST(? AS varchar), projectId), referrerId = COALESCE(CAST(? AS varchar), referrerId), recipientId = COALESCE(CAST(? AS varchar), recipientId), recipientType = ?, reasons = ?, additionalDetails = ?, sideEffectId = COALESCE(CAST(? AS varchar), sideEffectId), sideEffectClientReferenceId = COALESCE(CAST(? AS varchar), sideEffectClientReferenceId), lastModifiedBy = ?, lastModifiedTime = ?, clientLastModifiedBy = ?, clientLastModifiedTime = ?, rowVersion = ?, isDeleted = ? WHERE ID = ? AND rowVersion <= ?;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.projectBeneficiaryId
            - jsonPath: $.*.projectBeneficiaryClientReferenceId
            - jsonPath: $.*.projectId
            - jsonPath: $.*.referrerId
            - jsonPath: $.*.recipientId
            - jsonPath: $.*.recipientType
            - jsonPath: $.*.reasons
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.sideEffect.id
            - jsonPath: $.*.sideEffect.clientReferenceId
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted
            - jsonPath: $.*.id
            - jsonPath: $.*.rowVersion

