serviceMaps:
  serviceName: referralmanagement
  mappings:
    - version: 1.0
      description: Saves a side effect
      fromTopic: save-side-effect-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: REFERRALMANAGEMENT
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      userUuidJsonPath: $.[0].auditDetails.createdBy
      transactionCodeJsonPath: $.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO health.SIDE_EFFECT(id, clientReferenceId, tenantId, taskId, taskClientReferenceId, projectBeneficiaryId, projectBeneficiaryClientReferenceId, symptoms, additionalDetails, createdBy, createdTime, lastModifiedBy, lastModifiedTime, clientCreatedBy, clientCreatedTime, clientLastModifiedBy, clientLastModifiedTime, rowVersion, isDeleted) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?,?);
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.id
            - jsonPath: $.*.clientReferenceId
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.taskId
            - jsonPath: $.*.taskClientReferenceId
            - jsonPath: $.*.projectBeneficiaryId
            - jsonPath: $.*.projectBeneficiaryClientReferenceId
            - jsonPath: $.*.symptoms
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.auditDetails.createdBy
            - jsonPath: $.*.auditDetails.createdTime
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.clientAuditDetails.createdBy
            - jsonPath: $.*.clientAuditDetails.createdTime
            - jsonPath: $.*.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted

    - version: 1.0
      description: Updates a side effect
      fromTopic: update-side-effect-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: REFERRALMANAGEMENT
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      userUuidJsonPath: $.[0].auditDetails.createdBy
      transactionCodeJsonPath: $.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        # The four link columns were overwritten unconditionally, so an update that omits them wiped
        # the links off an already-persisted row. taskClientReferenceId is NOT NULL
        # (V20231010120100), so that omission raised 23502 and the record was parked. COALESCE keeps
        # the stored link when the payload does not carry one. Trade-off: a link can no longer be
        # cleared to NULL through this topic, which is correct - nothing legitimately unlinks a side
        # effect from its task or beneficiary.
        # Optimistic-lock guard (proven live in DI-L06): without a version predicate a stale or
        # out-of-order replay silently overwrote a newer row. rowVersion <= ? applies the write only
        # if the stored version is not ahead of the incoming one; a stale message now affects 0 rows,
        # which the affected-rows classifier surfaces instead of losing the write.
        - query: UPDATE health.SIDE_EFFECT SET tenantId = ?, taskId = COALESCE(CAST(? AS varchar), taskId), taskClientReferenceId = COALESCE(CAST(? AS varchar), taskClientReferenceId), projectBeneficiaryId = COALESCE(CAST(? AS varchar), projectBeneficiaryId), projectBeneficiaryClientReferenceId = COALESCE(CAST(? AS varchar), projectBeneficiaryClientReferenceId), symptoms = ?, additionalDetails = ?, lastModifiedBy = ?, lastModifiedTime = ?, clientLastModifiedBy = ?, clientLastModifiedTime = ?, rowVersion = ?, isDeleted = ? WHERE ID = ? AND rowVersion <= ?;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.taskId
            - jsonPath: $.*.taskClientReferenceId
            - jsonPath: $.*.projectBeneficiaryId
            - jsonPath: $.*.projectBeneficiaryClientReferenceId
            - jsonPath: $.*.symptoms
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted
            - jsonPath: $.*.id
            - jsonPath: $.*.rowVersion

    - version: 1.0
      description: Deletes a side effect
      fromTopic: delete-side-effect-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: REFERRALMANAGEMENT
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      userUuidJsonPath: $.[0].auditDetails.createdBy
      transactionCodeJsonPath: $.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        # Optimistic-lock guard (proven live in DI-L06): without a version predicate a stale or
        # out-of-order replay silently overwrote a newer row. rowVersion <= ? applies the write only
        # if the stored version is not ahead of the incoming one; a stale message now affects 0 rows,
        # which the affected-rows classifier surfaces instead of losing the write.
        - query: UPDATE health.SIDE_EFFECT SET lastModifiedBy = ?, lastModifiedTime = ?, clientLastModifiedBy = ?, clientLastModifiedTime = ?, rowVersion = ?, isDeleted = ? WHERE ID = ? AND rowVersion <= ?;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.auditDetails.lastModifiedBy
            - jsonPath: $.*.auditDetails.lastModifiedTime
            - jsonPath: $.*.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.rowVersion
            - jsonPath: $.*.isDeleted
            - jsonPath: $.*.id
            - jsonPath: $.*.rowVersion

    - version: 1.0
      description: Saves a referral
