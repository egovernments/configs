        - query: UPDATE health.REFERRAL SET lastModifiedBy = ?, lastModifiedTime = ?, clientLastModifiedBy = ?, clientLastModifiedTime = ?, rowVersion = ?, isDeleted = ? WHERE ID = ? AND rowVersion <= ?;
          basePath: $.*
          jsonMaps:
