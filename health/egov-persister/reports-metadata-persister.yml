serviceMaps:
  serviceName: household
  mappings:
    - version: 1.0
      description: Persists household.
      fromTopic: save-hcm-report-metadata
      isTransaction: true
      isAuditEnabled: true
      module: REPORTS
      objecIdJsonPath: $.dag_run_id
      tenantIdJsonPath: $.tenant_id
      userUuidJsonPath: $.[0].auditDetails.createdBy
      transactionCodeJsonPath: $.dag_run_id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO health.REPORTS_METADATA(tenantId, dagRunId, dagName, campaignIdentifier, reportName, triggerFrequency, triggerTime, fileStoreId) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
          basePath: $
          jsonMaps:
            - jsonPath: $.tenant_id
            - jsonPath: $.dag_run_id
            - jsonPath: $.dag_name
            - jsonPath: $.campaign_identifier
            - jsonPath: $.report_name
            - jsonPath: $.trigger_frequency
            - jsonPath: $.trigger_time
            - jsonPath: $.file_store_id