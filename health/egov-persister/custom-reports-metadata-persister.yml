serviceMaps:
  serviceName: hcm-report-metadata
  mappings:
  - version: 1.0
    description: Persists HCM report metadata in hcm_report_metadata table
    fromTopic: save-hcm-report-metadata
    isTransaction: true
    queryMaps:

    - query: INSERT INTO hcm_report_metadata(tenantid, dagrunid, dagname, campaignidentifier, reportname, triggerfrequency, triggerdate, filestoreid) VALUES (?, ?, ?, ?, ?, ?, ?, ?);
      basePath: $
      jsonMaps:
      - jsonPath: $.tenant_id

      - jsonPath: $.dag_run_id

      - jsonPath: $.dag_name

      - jsonPath: $.campaign_identifier

      - jsonPath: $.report_name

      - jsonPath: $.trigger_frequency

      - jsonPath: $.trigger_time

      - jsonPath: $.file_store_id