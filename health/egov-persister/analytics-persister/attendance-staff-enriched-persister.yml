serviceMaps:
  serviceName: attendance-staff-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched attendance staff data into the downstream reporting table.
      fromTopic: transformer-producer-attendance-staff-index-v1-topic
      isTransaction: true
      isAuditEnabled: true
      module: ATTENDANCE
      objecIdJsonPath: $.staff.id
      tenantIdJsonPath: $.staff.tenantId
      userUuidJsonPath: $.[0].staff.auditDetails.createdBy
      transactionCodeJsonPath: $.staff.id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO "analytics-test".attendance_staff_enriched(id, tenant_id, register_id, user_id, enrollment_date, denrollment_date, created_by, last_modified_by, created_time, last_modified_time, additional_details, user_name, name_of_user, role, register_service_code, register_name, register_number, country_code, province_code, district_code, post_administrative_code, locality_code, village_code, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?::date, ?::date, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET register_id = EXCLUDED.register_id, user_id = EXCLUDED.user_id, enrollment_date = EXCLUDED.enrollment_date, denrollment_date = EXCLUDED.denrollment_date, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, additional_details = EXCLUDED.additional_details, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, register_service_code = EXCLUDED.register_service_code, register_name = EXCLUDED.register_name, register_number = EXCLUDED.register_number, country_code = EXCLUDED.country_code, province_code = EXCLUDED.province_code, district_code = EXCLUDED.district_code, post_administrative_code = EXCLUDED.post_administrative_code, locality_code = EXCLUDED.locality_code, village_code = EXCLUDED.village_code, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.staff.id
            - jsonPath: $.*.staff.tenantId
            - jsonPath: $.*.staff.registerId
            - jsonPath: $.*.staff.userId
            - jsonPath: $.*.staff.enrollmentDate
              dbType: STRING
            - jsonPath: $.*.staff.denrollmentDate
              dbType: STRING
            - jsonPath: $.*.staff.auditDetails.createdBy
            - jsonPath: $.*.staff.auditDetails.lastModifiedBy
            - jsonPath: $.*.staff.auditDetails.createdTime
            - jsonPath: $.*.staff.auditDetails.lastModifiedTime
            - jsonPath: $.*.staff.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.registerServiceCode
            - jsonPath: $.*.registerName
            - jsonPath: $.*.registerNumber
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.province
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.POSTADMINISTRATIVE
            - jsonPath: $.*.boundaryHierarchyCode.locality
            - jsonPath: $.*.boundaryHierarchyCode.village
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
