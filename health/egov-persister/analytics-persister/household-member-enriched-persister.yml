serviceMaps:
  serviceName: household-member-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched household member data into the downstream reporting table.
      fromTopic: transformer-producer-household-member-index-v1-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: HOUSEHOLD
      objecIdJsonPath: $.householdMember.id
      tenantIdJsonPath: $.householdMember.tenantId
      userUuidJsonPath: $.[0].householdMember.auditDetails.createdBy
      transactionCodeJsonPath: $.householdMember.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO "analytics-test".household_member_enriched(id, tenant_id, client_reference_id, household_id, household_client_reference_id, individual_id, individual_client_reference_id, is_head_of_household, is_deleted, row_version, member_additional_fields, created_by, last_modified_by, created_time, last_modified_time, client_created_by, client_last_modified_by, client_created_time, client_last_modified_time, country_code, province_code, district_code, post_administrative_code, locality_code, village_code, date_of_birth, age, gender, user_name, name_of_user, role, user_address, task_dates, synced_date, synced_time_stamp, geo_point_lat, geo_point_lon, boundary_code, additional_details, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?::date, ?::date, ?::timestamptz, CAST((?::jsonb)->>1 AS double precision), CAST((?::jsonb)->>0 AS double precision), ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET client_reference_id = EXCLUDED.client_reference_id, is_head_of_household = EXCLUDED.is_head_of_household, is_deleted = EXCLUDED.is_deleted, row_version = EXCLUDED.row_version, member_additional_fields = EXCLUDED.member_additional_fields, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, client_last_modified_by = EXCLUDED.client_last_modified_by, client_last_modified_time = EXCLUDED.client_last_modified_time, country_code = EXCLUDED.country_code, province_code = EXCLUDED.province_code, district_code = EXCLUDED.district_code, post_administrative_code = EXCLUDED.post_administrative_code, locality_code = EXCLUDED.locality_code, village_code = EXCLUDED.village_code, date_of_birth = EXCLUDED.date_of_birth, age = EXCLUDED.age, gender = EXCLUDED.gender, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, user_address = EXCLUDED.user_address, task_dates = EXCLUDED.task_dates, synced_date = EXCLUDED.synced_date, synced_time_stamp = EXCLUDED.synced_time_stamp, geo_point_lat = EXCLUDED.geo_point_lat, geo_point_lon = EXCLUDED.geo_point_lon, boundary_code = EXCLUDED.boundary_code, additional_details = EXCLUDED.additional_details, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.householdMember.id
            - jsonPath: $.*.householdMember.tenantId
            - jsonPath: $.*.householdMember.clientReferenceId
            - jsonPath: $.*.householdMember.householdId
            - jsonPath: $.*.householdMember.householdClientReferenceId
            - jsonPath: $.*.householdMember.individualId
            - jsonPath: $.*.householdMember.individualClientReferenceId
            - jsonPath: $.*.householdMember.isHeadOfHousehold
            - jsonPath: $.*.householdMember.isDeleted
            - jsonPath: $.*.householdMember.rowVersion
            - jsonPath: $.*.householdMember.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.householdMember.auditDetails.createdBy
            - jsonPath: $.*.householdMember.auditDetails.lastModifiedBy
            - jsonPath: $.*.householdMember.auditDetails.createdTime
            - jsonPath: $.*.householdMember.auditDetails.lastModifiedTime
            - jsonPath: $.*.householdMember.clientAuditDetails.createdBy
            - jsonPath: $.*.householdMember.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.householdMember.clientAuditDetails.createdTime
            - jsonPath: $.*.householdMember.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.province
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.POSTADMINISTRATIVE
            - jsonPath: $.*.boundaryHierarchyCode.locality
            - jsonPath: $.*.boundaryHierarchyCode.village

            - jsonPath: $.*.dateOfBirth

            - jsonPath: $.*.age
            - jsonPath: $.*.gender
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.userAddress
            - jsonPath: $.*.taskDates
              dbType: STRING
            - jsonPath: $.*.syncedDate
              dbType: STRING
            - jsonPath: $.*.syncedTimeStamp
              dbType: STRING
            - jsonPath: $.*.geoPoint
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.geoPoint
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.localityCode
            - jsonPath: $.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
