# NOTE: fromTopic is the kebab-case of the Spring property key "transformer.producer.musterroll.index.v1.topic"
# (TransformerProperties.java, note: "musterroll" is one word in the property) — not found in any
# deployed Helm values.yaml checked in this repo tree. Verify against your deployment before use.
serviceMaps:
  serviceName: muster-roll-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched muster roll data into the downstream reporting table.
      fromTopic: transformer-producer-musterroll-index-v1-topic
      isTransaction: true
      isAuditEnabled: true
      module: MUSTER-ROLL
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.musterRoll.tenantId
      userUuidJsonPath: $.[0].musterRoll.auditDetails.createdBy
      transactionCodeJsonPath: $.id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO muster_roll_enriched(id, tenant_id, muster_roll_number, register_id, status, muster_roll_status, start_date, end_date, individual_entries, reference_id, service_code, billing_period_id, additional_details, created_by, last_modified_by, created_time, last_modified_time, process_instance, reports, edited, user_name, name_of_user, role, country_code, region_code, district_code, health_facility_code, settlement_code, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET status = EXCLUDED.status, muster_roll_status = EXCLUDED.muster_roll_status, individual_entries = EXCLUDED.individual_entries, billing_period_id = EXCLUDED.billing_period_id, additional_details = EXCLUDED.additional_details, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, process_instance = EXCLUDED.process_instance, reports = EXCLUDED.reports, edited = EXCLUDED.edited, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, country_code = EXCLUDED.country_code, region_code = EXCLUDED.region_code, district_code = EXCLUDED.district_code, health_facility_code = EXCLUDED.health_facility_code, settlement_code = EXCLUDED.settlement_code, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.id
            - jsonPath: $.*.musterRoll.tenantId
            - jsonPath: $.*.musterRoll.musterRollNumber
            - jsonPath: $.*.musterRoll.registerId
            - jsonPath: $.*.musterRoll.status
            - jsonPath: $.*.musterRoll.musterRollStatus
            - jsonPath: $.*.musterRoll.startDate
            - jsonPath: $.*.musterRoll.endDate
            - jsonPath: $.*.musterRoll.individualEntries
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.musterRoll.referenceId
            - jsonPath: $.*.musterRoll.serviceCode
            - jsonPath: $.*.musterRoll.billingPeriodId
            - jsonPath: $.*.musterRoll.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.musterRoll.auditDetails.createdBy
            - jsonPath: $.*.musterRoll.auditDetails.lastModifiedBy
            - jsonPath: $.*.musterRoll.auditDetails.createdTime
            - jsonPath: $.*.musterRoll.auditDetails.lastModifiedTime
            - jsonPath: $.*.musterRoll.processInstance
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.musterRoll.reports
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.edited
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.region
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.healthFacility
            - jsonPath: $.*.boundaryHierarchyCode.settlement
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
