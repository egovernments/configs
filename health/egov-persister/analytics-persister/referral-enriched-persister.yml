serviceMaps:
  serviceName: referral-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched referral data into the downstream reporting table.
      fromTopic: transformer-producer-referral-index-v1-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: REFERRALMANAGEMENT
      objecIdJsonPath: $.referral.id
      tenantIdJsonPath: $.referral.tenantId
      userUuidJsonPath: $.[0].referral.auditDetails.createdBy
      transactionCodeJsonPath: $.referral.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO analytics-test.referral_enriched(id, client_reference_id, project_beneficiary_id, project_beneficiary_client_reference_id, referrer_id, recipient_type, recipient_id, reasons, side_effect, tenant_id, is_deleted, row_version, created_by, last_modified_by, created_time, last_modified_time, client_created_by, client_last_modified_by, client_created_time, client_last_modified_time, additional_fields, date_of_birth, user_name, name_of_user, role, user_address, age, country_code, province_code, district_code, post_administrative_code, locality_code, village_code, facility_name, individual_id, gender, task_dates, synced_date, additional_details, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET project_beneficiary_id = EXCLUDED.project_beneficiary_id, project_beneficiary_client_reference_id = EXCLUDED.project_beneficiary_client_reference_id, referrer_id = EXCLUDED.referrer_id, recipient_type = EXCLUDED.recipient_type, recipient_id = EXCLUDED.recipient_id, reasons = EXCLUDED.reasons, side_effect = EXCLUDED.side_effect, tenant_id = EXCLUDED.tenant_id, is_deleted = EXCLUDED.is_deleted, row_version = EXCLUDED.row_version, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, client_last_modified_by = EXCLUDED.client_last_modified_by, client_last_modified_time = EXCLUDED.client_last_modified_time, additional_fields = EXCLUDED.additional_fields, date_of_birth = EXCLUDED.date_of_birth, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, user_address = EXCLUDED.user_address, age = EXCLUDED.age, country_code = EXCLUDED.country_code, province_code = EXCLUDED.province_code, district_code = EXCLUDED.district_code, post_administrative_code = EXCLUDED.post_administrative_code, locality_code = EXCLUDED.locality_code, village_code = EXCLUDED.village_code, facility_name = EXCLUDED.facility_name, individual_id = EXCLUDED.individual_id, gender = EXCLUDED.gender, task_dates = EXCLUDED.task_dates, synced_date = EXCLUDED.synced_date, additional_details = EXCLUDED.additional_details, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.referral.id
            - jsonPath: $.*.referral.clientReferenceId
            - jsonPath: $.*.referral.projectBeneficiaryId
            - jsonPath: $.*.referral.projectBeneficiaryClientReferenceId
            - jsonPath: $.*.referral.referrerId
            - jsonPath: $.*.referral.recipientType
            - jsonPath: $.*.referral.recipientId
            - jsonPath: $.*.referral.reasons
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.referral.sideEffect
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.referral.tenantId
            - jsonPath: $.*.referral.isDeleted
            - jsonPath: $.*.referral.rowVersion
            - jsonPath: $.*.referral.auditDetails.createdBy
            - jsonPath: $.*.referral.auditDetails.lastModifiedBy
            - jsonPath: $.*.referral.auditDetails.createdTime
            - jsonPath: $.*.referral.auditDetails.lastModifiedTime
            - jsonPath: $.*.referral.clientAuditDetails.createdBy
            - jsonPath: $.*.referral.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.referral.clientAuditDetails.createdTime
            - jsonPath: $.*.referral.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.referral.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.dateOfBirth
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.userAddress
            - jsonPath: $.*.age
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.province
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.POSTADMINISTRATIVE
            - jsonPath: $.*.boundaryHierarchyCode.locality
            - jsonPath: $.*.boundaryHierarchyCode.village
            - jsonPath: $.*.facilityName
            - jsonPath: $.*.individualId
            - jsonPath: $.*.gender
            - jsonPath: $.*.taskDates
            - jsonPath: $.*.syncedDate
            - jsonPath: $.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
