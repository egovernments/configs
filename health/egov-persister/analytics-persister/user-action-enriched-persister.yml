serviceMaps:
  serviceName: user-action-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched user action data into the downstream reporting table.
      fromTopic: transformer-producer-user-action-index-v1-topic
      isTransaction: true
      isAuditEnabled: true
      module: PROJECT
      objecIdJsonPath: $.userAction.id
      tenantIdJsonPath: $.userAction.tenantId
      userUuidJsonPath: $.[0].userAction.auditDetails.createdBy
      transactionCodeJsonPath: $.userAction.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO analytics-test.user_action_enriched(id, tenant_id, client_reference_id, raw_project_id, latitude, longitude, location_accuracy, boundary_code, action, beneficiary_tag, resource_tag, is_deleted, additional_fields, created_by, last_modified_by, created_time, last_modified_time, client_created_by, client_last_modified_by, client_created_time, client_last_modified_time, project_id, project_type, project_type_id, user_name, name_of_user, role, synced_time_stamp, synced_time, task_dates, synced_date, geo_latitude, geo_longitude, country_code, region_code, district_code, health_facility_code, settlement_code, additional_details, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET tenant_id = EXCLUDED.tenant_id, client_reference_id = EXCLUDED.client_reference_id, raw_project_id = EXCLUDED.raw_project_id, latitude = EXCLUDED.latitude, longitude = EXCLUDED.longitude, location_accuracy = EXCLUDED.location_accuracy, boundary_code = EXCLUDED.boundary_code, action = EXCLUDED.action, beneficiary_tag = EXCLUDED.beneficiary_tag, resource_tag = EXCLUDED.resource_tag, is_deleted = EXCLUDED.is_deleted, additional_fields = EXCLUDED.additional_fields, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, client_last_modified_by = EXCLUDED.client_last_modified_by, client_last_modified_time = EXCLUDED.client_last_modified_time, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, synced_time_stamp = EXCLUDED.synced_time_stamp, synced_time = EXCLUDED.synced_time, task_dates = EXCLUDED.task_dates, synced_date = EXCLUDED.synced_date, geo_latitude = EXCLUDED.geo_latitude, geo_longitude = EXCLUDED.geo_longitude, country_code = EXCLUDED.country_code, region_code = EXCLUDED.region_code, district_code = EXCLUDED.district_code, health_facility_code = EXCLUDED.health_facility_code, settlement_code = EXCLUDED.settlement_code, additional_details = EXCLUDED.additional_details, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.userAction.id
            - jsonPath: $.*.userAction.tenantId
            - jsonPath: $.*.userAction.clientReferenceId
            - jsonPath: $.*.userAction.projectId
            - jsonPath: $.*.userAction.latitude
            - jsonPath: $.*.userAction.longitude
            - jsonPath: $.*.userAction.locationAccuracy
            - jsonPath: $.*.userAction.boundaryCode
            - jsonPath: $.*.userAction.action
            - jsonPath: $.*.userAction.beneficiaryTag
            - jsonPath: $.*.userAction.resourceTag
            - jsonPath: $.*.userAction.isDeleted
            - jsonPath: $.*.userAction.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.userAction.auditDetails.createdBy
            - jsonPath: $.*.userAction.auditDetails.lastModifiedBy
            - jsonPath: $.*.userAction.auditDetails.createdTime
            - jsonPath: $.*.userAction.auditDetails.lastModifiedTime
            - jsonPath: $.*.userAction.clientAuditDetails.createdBy
            - jsonPath: $.*.userAction.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.userAction.clientAuditDetails.createdTime
            - jsonPath: $.*.userAction.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.syncedTimeStamp
            - jsonPath: $.*.syncedTime
            - jsonPath: $.*.taskDates
            - jsonPath: $.*.syncedDate
            - jsonPath: $.*.geoPoint[0]
            - jsonPath: $.*.geoPoint[1]
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.region
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.healthFacility
            - jsonPath: $.*.boundaryHierarchyCode.settlement
            - jsonPath: $.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
