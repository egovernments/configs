serviceMaps:
  serviceName: attendance-log-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched attendance log data into the downstream reporting table.
      fromTopic: transformer-save-attendance-log-health
      isTransaction: true
      isAuditEnabled: true
      module: ATTENDANCE
      objecIdJsonPath: $.attendanceLog.id
      tenantIdJsonPath: $.attendanceLog.tenantId
      userUuidJsonPath: $.[0].attendanceLog.auditDetails.createdBy
      transactionCodeJsonPath: $.attendanceLog.id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO "analytics-test".attendance_log_enriched(id, tenant_id, register_id, individual_id, log_user_name, time, type, status, document_ids, log_additional_details, created_by, last_modified_by, created_time, last_modified_time, attendance_taker_user_name, attendance_taker_name_of_user, user_name, name_of_user, role, attendance_time, register_service_code, register_name, register_number, country_code, province_code, district_code, post_administrative_code, locality_code, village_code, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET log_user_name = EXCLUDED.log_user_name, time = EXCLUDED.time, type = EXCLUDED.type, status = EXCLUDED.status, document_ids = EXCLUDED.document_ids, log_additional_details = EXCLUDED.log_additional_details, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, attendance_taker_user_name = EXCLUDED.attendance_taker_user_name, attendance_taker_name_of_user = EXCLUDED.attendance_taker_name_of_user, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, attendance_time = EXCLUDED.attendance_time, register_service_code = EXCLUDED.register_service_code, register_name = EXCLUDED.register_name, register_number = EXCLUDED.register_number, country_code = EXCLUDED.country_code, province_code = EXCLUDED.province_code, district_code = EXCLUDED.district_code, post_administrative_code = EXCLUDED.post_administrative_code, locality_code = EXCLUDED.locality_code, village_code = EXCLUDED.village_code, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.attendanceLog.id
            - jsonPath: $.*.attendanceLog.tenantId
            - jsonPath: $.*.attendanceLog.registerId
            - jsonPath: $.*.attendanceLog.individualId
            - jsonPath: $.*.attendanceLog.userName
            - jsonPath: $.*.attendanceLog.time
            - jsonPath: $.*.attendanceLog.type
            - jsonPath: $.*.attendanceLog.status
            - jsonPath: $.*.attendanceLog.documentIds
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.attendanceLog.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.attendanceLog.auditDetails.createdBy
            - jsonPath: $.*.attendanceLog.auditDetails.lastModifiedBy
            - jsonPath: $.*.attendanceLog.auditDetails.createdTime
            - jsonPath: $.*.attendanceLog.auditDetails.lastModifiedTime
            - jsonPath: $.*.attendanceTakerUserName
            - jsonPath: $.*.attendanceTakerNameOfUser
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.attendanceTime
            - jsonPath: $.*.registerServiceCode
            - jsonPath: $.*.registerName
            - jsonPath: $.*.registerNumber
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.province
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.POSTADMINISTRATIVE
            - jsonPath: $.*.boundaryHierarchyCode.locality
            - jsonPath: $.*.boundaryHierarchyCode.village
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
