serviceMaps:
  serviceName: project-beneficiary-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched project beneficiary data into the downstream reporting table.
      fromTopic: transformer-producer-project-beneficiary-index-v1-topic
      isTransaction: true
      isAuditEnabled: true
      module: PROJECT
      objecIdJsonPath: $.projectBeneficiary.id
      tenantIdJsonPath: $.projectBeneficiary.tenantId
      userUuidJsonPath: $.[0].projectBeneficiary.auditDetails.createdBy
      transactionCodeJsonPath: $.projectBeneficiary.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO project_beneficiary_enriched(id, tenant_id, project_id, beneficiary_id, beneficiary_client_reference_id, client_reference_id, date_of_registration, tag, is_deleted, row_version, beneficiary_additional_fields, created_by, last_modified_by, created_time, last_modified_time, client_created_by, client_last_modified_by, client_created_time, client_last_modified_time, country_code, region_code, district_code, health_facility_code, settlement_code, user_name, name_of_user, role, user_address, task_dates, synced_date, synced_time_stamp, additional_details, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET project_id = EXCLUDED.project_id, beneficiary_id = EXCLUDED.beneficiary_id, beneficiary_client_reference_id = EXCLUDED.beneficiary_client_reference_id, client_reference_id = EXCLUDED.client_reference_id, date_of_registration = EXCLUDED.date_of_registration, tag = EXCLUDED.tag, is_deleted = EXCLUDED.is_deleted, row_version = EXCLUDED.row_version, beneficiary_additional_fields = EXCLUDED.beneficiary_additional_fields, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, client_last_modified_by = EXCLUDED.client_last_modified_by, client_last_modified_time = EXCLUDED.client_last_modified_time, country_code = EXCLUDED.country_code, region_code = EXCLUDED.region_code, district_code = EXCLUDED.district_code, health_facility_code = EXCLUDED.health_facility_code, settlement_code = EXCLUDED.settlement_code, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, user_address = EXCLUDED.user_address, task_dates = EXCLUDED.task_dates, synced_date = EXCLUDED.synced_date, synced_time_stamp = EXCLUDED.synced_time_stamp, additional_details = EXCLUDED.additional_details, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.projectBeneficiary.id
            - jsonPath: $.*.projectBeneficiary.tenantId
            - jsonPath: $.*.projectBeneficiary.projectId
            - jsonPath: $.*.projectBeneficiary.beneficiaryId
            - jsonPath: $.*.projectBeneficiary.beneficiaryClientReferenceId
            - jsonPath: $.*.projectBeneficiary.clientReferenceId
            - jsonPath: $.*.projectBeneficiary.dateOfRegistration
            - jsonPath: $.*.projectBeneficiary.tag
            - jsonPath: $.*.projectBeneficiary.isDeleted
            - jsonPath: $.*.projectBeneficiary.rowVersion
            - jsonPath: $.*.projectBeneficiary.additionalFields
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.projectBeneficiary.auditDetails.createdBy
            - jsonPath: $.*.projectBeneficiary.auditDetails.lastModifiedBy
            - jsonPath: $.*.projectBeneficiary.auditDetails.createdTime
            - jsonPath: $.*.projectBeneficiary.auditDetails.lastModifiedTime
            - jsonPath: $.*.projectBeneficiary.clientAuditDetails.createdBy
            - jsonPath: $.*.projectBeneficiary.clientAuditDetails.lastModifiedBy
            - jsonPath: $.*.projectBeneficiary.clientAuditDetails.createdTime
            - jsonPath: $.*.projectBeneficiary.clientAuditDetails.lastModifiedTime
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.region
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.healthFacility
            - jsonPath: $.*.boundaryHierarchyCode.settlement
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.userAddress
            - jsonPath: $.*.taskDates
            - jsonPath: $.*.syncedDate
            - jsonPath: $.*.syncedTimeStamp
            - jsonPath: $.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
