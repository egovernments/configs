serviceMaps:
  serviceName: bill-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched bill data into the downstream reporting table.
      fromTopic: transformer-producer-bill-index-v1-topic
      isTransaction: true
      isAuditEnabled: true
      module: BILL
      objecIdJsonPath: $.bill.id
      tenantIdJsonPath: $.bill.tenantId
      userUuidJsonPath: $.[0].bill.auditDetails.createdBy
      transactionCodeJsonPath: $.bill.id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO "analytics-test".bill_enriched(id, tenant_id, boundary_code, bill_date, due_date, total_amount, total_wage_amount, total_food_amount, total_transport_amount, total_paid_amount, business_service, reference_id, from_period, to_period, payment_status, status, bill_number, payer, bill_details, additional_details, created_by, last_modified_by, created_time, last_modified_time, wf_status, process_instance, wf_status_info, user_name, name_of_user, role, country_code, province_code, district_code, post_administrative_code, locality_code, village_code, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET boundary_code = EXCLUDED.boundary_code, bill_date = EXCLUDED.bill_date, due_date = EXCLUDED.due_date, total_amount = EXCLUDED.total_amount, total_wage_amount = EXCLUDED.total_wage_amount, total_food_amount = EXCLUDED.total_food_amount, total_transport_amount = EXCLUDED.total_transport_amount, total_paid_amount = EXCLUDED.total_paid_amount, business_service = EXCLUDED.business_service, reference_id = EXCLUDED.reference_id, from_period = EXCLUDED.from_period, to_period = EXCLUDED.to_period, payment_status = EXCLUDED.payment_status, status = EXCLUDED.status, payer = EXCLUDED.payer, bill_details = EXCLUDED.bill_details, additional_details = EXCLUDED.additional_details, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, wf_status = EXCLUDED.wf_status, process_instance = EXCLUDED.process_instance, wf_status_info = EXCLUDED.wf_status_info, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, country_code = EXCLUDED.country_code, province_code = EXCLUDED.province_code, district_code = EXCLUDED.district_code, post_administrative_code = EXCLUDED.post_administrative_code, locality_code = EXCLUDED.locality_code, village_code = EXCLUDED.village_code, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.bill.id
            - jsonPath: $.*.bill.tenantId
            - jsonPath: $.*.bill.localityCode
            - jsonPath: $.*.bill.billDate
            - jsonPath: $.*.bill.dueDate
            - jsonPath: $.*.bill.totalAmount
            - jsonPath: $.*.bill.totalWageAmount
            - jsonPath: $.*.bill.totalFoodAmount
            - jsonPath: $.*.bill.totalTransportAmount
            - jsonPath: $.*.bill.totalPaidAmount
            - jsonPath: $.*.bill.businessService
            - jsonPath: $.*.bill.referenceId
            - jsonPath: $.*.bill.fromPeriod
            - jsonPath: $.*.bill.toPeriod
            - jsonPath: $.*.bill.paymentStatus
            - jsonPath: $.*.bill.status
            - jsonPath: $.*.bill.billNumber
            - jsonPath: $.*.bill.payer
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.bill.billDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.bill.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.bill.auditDetails.createdBy
            - jsonPath: $.*.bill.auditDetails.lastModifiedBy
            - jsonPath: $.*.bill.auditDetails.createdTime
            - jsonPath: $.*.bill.auditDetails.lastModifiedTime
            - jsonPath: $.*.bill.wfStatus
            - jsonPath: $.*.bill.processInstance
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.wfStatusInfo
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.province
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.POSTADMINISTRATIVE
            - jsonPath: $.*.boundaryHierarchyCode.locality
            - jsonPath: $.*.boundaryHierarchyCode.village
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
