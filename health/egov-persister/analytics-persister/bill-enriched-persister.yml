# NOTE: fromTopic is the kebab-case of the Spring property key "transformer.producer.bill.index.v1.topic"
# (TransformerProperties.java) — not found in any deployed Helm values.yaml checked in this repo tree.
# Verify against your deployment before use.
serviceMaps:
  serviceName: bill-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched bill data into the downstream reporting table.
      fromTopic: transformer-producer-bill-index-v1-topic
      isTransaction: true
      isAuditEnabled: true
      module: BILL
      objecIdJsonPath: $.bill.id
      tenantIdJsonPath: $.bill.tenantId
      userUuidJsonPath: $.[0].bill.auditDetails.createdBy
      transactionCodeJsonPath: $.bill.id
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO bill_enriched(id, tenant_id, locality_code, bill_date, due_date, total_amount, total_wage_amount, total_food_amount, total_transport_amount, total_paid_amount, business_service, reference_id, from_period, to_period, payment_status, status, bill_number, payer, bill_details, additional_details, created_by, last_modified_by, created_time, last_modified_time, wf_status, process_instance, wf_status_info, user_name, name_of_user, role, country_code, region_code, district_code, health_facility_code, settlement_code, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET locality_code = EXCLUDED.locality_code, bill_date = EXCLUDED.bill_date, due_date = EXCLUDED.due_date, total_amount = EXCLUDED.total_amount, total_wage_amount = EXCLUDED.total_wage_amount, total_food_amount = EXCLUDED.total_food_amount, total_transport_amount = EXCLUDED.total_transport_amount, total_paid_amount = EXCLUDED.total_paid_amount, business_service = EXCLUDED.business_service, reference_id = EXCLUDED.reference_id, from_period = EXCLUDED.from_period, to_period = EXCLUDED.to_period, payment_status = EXCLUDED.payment_status, status = EXCLUDED.status, payer = EXCLUDED.payer, bill_details = EXCLUDED.bill_details, additional_details = EXCLUDED.additional_details, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, wf_status = EXCLUDED.wf_status, process_instance = EXCLUDED.process_instance, wf_status_info = EXCLUDED.wf_status_info, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, country_code = EXCLUDED.country_code, region_code = EXCLUDED.region_code, district_code = EXCLUDED.district_code, health_facility_code = EXCLUDED.health_facility_code, settlement_code = EXCLUDED.settlement_code, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.bill.id
            - jsonPath: $.*.bill.tenantId
            - jsonPath: $.*.bill.localityCode
            - jsonPath: $.*.bill.billDate
            - jsonPath: $.*.bill.dueDate
            - jsonPath: $.*.bill.totalAmount
            - jsonPath: $.*.bill.totalWageAmount
            - jsonPath: $.*.bill.totalFoodAmount
            - jsonPath: $.*.bill.totalTransportAmount
            - jsonPath: $.*.bill.totalPaidAmount
            - jsonPath: $.*.bill.businessService
            - jsonPath: $.*.bill.referenceId
            - jsonPath: $.*.bill.fromPeriod
            - jsonPath: $.*.bill.toPeriod
            - jsonPath: $.*.bill.paymentStatus
            - jsonPath: $.*.bill.status
            - jsonPath: $.*.bill.billNumber
            - jsonPath: $.*.bill.payer
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.bill.billDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.bill.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.bill.auditDetails.createdBy
            - jsonPath: $.*.bill.auditDetails.lastModifiedBy
            - jsonPath: $.*.bill.auditDetails.createdTime
            - jsonPath: $.*.bill.auditDetails.lastModifiedTime
            - jsonPath: $.*.bill.wfStatus
            - jsonPath: $.*.bill.processInstance
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.wfStatusInfo
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.region
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.healthFacility
            - jsonPath: $.*.boundaryHierarchyCode.settlement
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
