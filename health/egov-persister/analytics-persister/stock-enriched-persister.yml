D.tenant_id, facility_type = EXCLUDED.facility_type, transacting_facility_type = EXCLUDED.transacting_facility_type, facility_level = EXCLUDED.facility_level, transacting_facility_level = EXCLUDED.transacting_facility_level, facility_target = EXCLUDED.facility_target, task_dates = EXCLUDED.task_dates, synced_date = EXCLUDED.synced_date, additional_details = EXCLUDED.additional_details, waybill_number = EXCLUDED.waybill_number, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
