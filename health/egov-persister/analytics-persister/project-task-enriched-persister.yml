serviceMaps:
  serviceName: project-task-enriched-enrichment-service
  mappings:
    - version: 1.0
      description: Persists enriched project task data into the downstream reporting table.
      fromTopic: transformer-producer-bulk-project-task-index-v1-health-topic
      isTransaction: true
      isAuditEnabled: true
      module: PROJECT
      objecIdJsonPath: $.id
      tenantIdJsonPath: $.tenantId
      userUuidJsonPath: $.[0].createdBy
      transactionCodeJsonPath: $.clientReferenceId
      auditAttributeBasePath: $.*
      queryMaps:
        - query: INSERT INTO "analytics-test".project_task_enriched(id, task_id, task_type, status, tenant_id, administration_status, client_reference_id, task_client_reference_id, project_beneficiary_client_reference_id, created_by, last_modified_by, created_time, last_modified_time, product_variant, product_name, quantity, delivered_to, is_delivered, delivery_comments, household_id, member_count, individual_id, date_of_birth, user_name, name_of_user, role, user_address, latitude, longitude, location_accuracy, boundary_code, country_code, province_code, district_code, post_administrative_code, locality_code, village_code, synced_time_stamp, synced_date, synced_time, task_dates, additional_details, project_id, project_type, project_type_id, project_name, campaign_number, campaign_id) VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?::timestamptz, ?::date, ?, ?::date, ?, ?, ?, ?, ?, ?, ?) ON CONFLICT (id) DO UPDATE SET task_id = EXCLUDED.task_id, task_type = EXCLUDED.task_type, status = EXCLUDED.status, tenant_id = EXCLUDED.tenant_id, administration_status = EXCLUDED.administration_status, task_client_reference_id = EXCLUDED.task_client_reference_id, project_beneficiary_client_reference_id = EXCLUDED.project_beneficiary_client_reference_id, last_modified_by = EXCLUDED.last_modified_by, last_modified_time = EXCLUDED.last_modified_time, product_variant = EXCLUDED.product_variant, product_name = EXCLUDED.product_name, quantity = EXCLUDED.quantity, delivered_to = EXCLUDED.delivered_to, is_delivered = EXCLUDED.is_delivered, delivery_comments = EXCLUDED.delivery_comments, household_id = EXCLUDED.household_id, member_count = EXCLUDED.member_count, individual_id = EXCLUDED.individual_id, date_of_birth = EXCLUDED.date_of_birth, user_name = EXCLUDED.user_name, name_of_user = EXCLUDED.name_of_user, role = EXCLUDED.role, user_address = EXCLUDED.user_address, latitude = EXCLUDED.latitude, longitude = EXCLUDED.longitude, location_accuracy = EXCLUDED.location_accuracy, boundary_code = EXCLUDED.boundary_code, country_code = EXCLUDED.country_code, province_code = EXCLUDED.province_code, district_code = EXCLUDED.district_code, post_administrative_code = EXCLUDED.post_administrative_code, locality_code = EXCLUDED.locality_code, village_code = EXCLUDED.village_code, synced_time_stamp = EXCLUDED.synced_time_stamp, synced_date = EXCLUDED.synced_date, synced_time = EXCLUDED.synced_time, task_dates = EXCLUDED.task_dates, additional_details = EXCLUDED.additional_details, project_id = EXCLUDED.project_id, project_type = EXCLUDED.project_type, project_type_id = EXCLUDED.project_type_id, project_name = EXCLUDED.project_name, campaign_number = EXCLUDED.campaign_number, campaign_id = EXCLUDED.campaign_id;
          basePath: $.*
          jsonMaps:
            - jsonPath: $.*.id
            - jsonPath: $.*.taskId
            - jsonPath: $.*.taskType
            - jsonPath: $.*.status
            - jsonPath: $.*.tenantId
            - jsonPath: $.*.administrationStatus
            - jsonPath: $.*.clientReferenceId
            - jsonPath: $.*.taskClientReferenceId
            - jsonPath: $.*.projectBeneficiaryClientReferenceId
            - jsonPath: $.*.createdBy
            - jsonPath: $.*.lastModifiedBy
            - jsonPath: $.*.createdTime
            - jsonPath: $.*.lastModifiedTime
            - jsonPath: $.*.productVariant
            - jsonPath: $.*.productName
            - jsonPath: $.*.quantity
            - jsonPath: $.*.deliveredTo
            - jsonPath: $.*.isDelivered
            - jsonPath: $.*.deliveryComments
            - jsonPath: $.*.householdId
            - jsonPath: $.*.memberCount
            - jsonPath: $.*.individualId
            - jsonPath: $.*.dateOfBirth
            - jsonPath: $.*.userName
            - jsonPath: $.*.nameOfUser
            - jsonPath: $.*.role
            - jsonPath: $.*.userAddress
            - jsonPath: $.*.latitude
            - jsonPath: $.*.longitude
            - jsonPath: $.*.locationAccuracy
            - jsonPath: $.*.localityCode
            - jsonPath: $.*.boundaryHierarchyCode.country
            - jsonPath: $.*.boundaryHierarchyCode.province
            - jsonPath: $.*.boundaryHierarchyCode.district
            - jsonPath: $.*.boundaryHierarchyCode.POSTADMINISTRATIVE
            - jsonPath: $.*.boundaryHierarchyCode.locality
            - jsonPath: $.*.boundaryHierarchyCode.village
            - jsonPath: $.*.syncedTimeStamp
              dbType: STRING
            - jsonPath: $.*.syncedDate
              dbType: STRING
            - jsonPath: $.*.syncedTime
            - jsonPath: $.*.taskDates
              dbType: STRING
            - jsonPath: $.*.additionalDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.projectId
            - jsonPath: $.*.projectType
            - jsonPath: $.*.projectTypeId
            - jsonPath: $.*.projectName
            - jsonPath: $.*.campaignNumber
            - jsonPath: $.*.campaignId
