            - jsonPath: $.*.service.user.type
            - jsonPath: $.*.service.user.mobileNumber
            - jsonPath: $.*.service.user.emailId
            - jsonPath: $.*.service.user.tenantId
            - jsonPath: $.*.service.user.uuid
            - jsonPath: $.*.service.user.active
            - jsonPath: $.*.service.user.roles
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.service.address.id
            - jsonPath: $.*.service.address.locality
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.service.address.additionDetails
              type: JSON
              dbType: JSONB
            - jsonPath: $.*.service.address.geoLocation.latitude
