ServiceMaps:
  serviceName: NOVU - message-search
  version: 1.0.0
  mappings:

    - topic: novu-message-legacyindex
      configKey: LEGACYINDEX
      indexes:
        - name: novumessages-index-v1
          type: messages
          id: $.id
          isBulk: true
          jsonPath: $.messages

          timeStampField: $.createdAt

          customJsonMapping:
            indexMapping: {
              "Data": {
                "id": "",
                "createdAt": "",
                "updatedAt": "",
                "channel": "",
                "status": "",
                "providerId": "",
                "transactionId": "",
                "complaintNo": "",
                "serviceName": "",
                "citizenName": "",
                "submittedDate": "",
                "complaintStatus": "",
                "@timestamp": ""
              }
            }

            fieldMapping:
              - inJsonPath: $.id
                outJsonPath: $.Data.id

              - inJsonPath: $.createdAt
                outJsonPath: $.Data.createdAt

              - inJsonPath: $.updatedAt
                outJsonPath: $.Data.updatedAt

              - inJsonPath: $.channel
                outJsonPath: $.Data.channel

              - inJsonPath: $.status
                outJsonPath: $.Data.status

              - inJsonPath: $.providerId
                outJsonPath: $.Data.providerId

              - inJsonPath: $.transactionId
                outJsonPath: $.Data.transactionId

              - inJsonPath: $.payload.complaintNo
                outJsonPath: $.Data.complaintNo

              - inJsonPath: $.payload.serviceName
                outJsonPath: $.Data.serviceName

              - inJsonPath: $.payload.citizenName
                outJsonPath: $.Data.citizenName

              - inJsonPath: $.payload.submittedDate
                outJsonPath: $.Data.submittedDate

              - inJsonPath: $.payload.status
                outJsonPath: $.Data.complaintStatus

              - inJsonPath: $.createdAt
                outJsonPath: $.Data.@timestamp